<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDICIÓN PRO</title>
<meta name="description" content="EDICIÓN PRO · Del storyboard al video.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d9ff48'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='%23111'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#0b0d0e;color:#f7f8f8;font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b0d0e}
#load{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
#load b{color:#d9ff48;font-size:16px;letter-spacing:.06em}
</style>
</head>
<body>
<div id="load"><div><b>EDICIÓN PRO</b><p>Cargando…</p></div></div>
<iframe id="app" title="EDICIÓN PRO" allow="clipboard-read; clipboard-write; autoplay; fullscreen; payment; web-share" allowfullscreen></iframe>
<script>
/* ===== Pega aquí tu URL de Apps Script (la que termina en /exec) ===== */
const APP = 'https://script.google.com/macros/s/AKfycbwd_VKaRDfasW1Jff_K91FYstbjYcDcHjMr-0lDnw-Fs2gvggfgEJKC-K4Q8-Bv9kdaQw/exec';

const load = document.getElementById('load'), frame = document.getElementById('app');
if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(APP)) {
  load.innerHTML = '<div><b>EDICIÓN PRO</b><p>Falta configurar la URL /exec de Apps Script en este archivo (const APP).</p></div>';
} else {
  // Si vuelves del inicio de sesión de Google, la sesión llega en #t=… y se pasa a la app.
  const m = location.hash.match(/[#&]t=([^&]+)/);
  if (m) history.replaceState(null, '', location.pathname + location.search);
  frame.onload = () => load.remove();
  frame.src = APP + (m ? (APP.indexOf('?') >= 0 ? '&' : '?') + 't=' + m[1] : '');
}
</script>
</body>
</html>
